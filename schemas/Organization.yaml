# Tenant gốc của downstream service. `console_organization_id` là khoá đối chiếu
# sang Platform (nguồn sự thật); mọi bảng nghiệp vụ tham chiếu tenant qua giá trị
# này chứ không qua `id` cục bộ.
kind: object

options:
  id: Uuid
  timestamps: true
  softDelete: true
  indexes:
    - columns: [slug]
      unique: true

properties:
  console_organization_id:
    type: Uuid
    unique: true
    displayName:
      ja: コンソール組織ID
      en: Console Organization ID
      vi: ID tổ chức trên Console

  name:
    type: String
    length: 100
    displayName:
      ja: 組織名
      en: Organization Name
      vi: Tên tổ chức

  slug:
    type: String
    length: 100
    displayName:
      ja: スラッグ
      en: Slug
      vi: Slug

  is_active:
    type: Boolean
    default: true
    displayName:
      ja: 有効
      en: Active
      vi: Hoạt động

  settings:
    type: Json
    nullable: true
    displayName:
      ja: 設定
      en: Settings
      vi: Cấu hình
